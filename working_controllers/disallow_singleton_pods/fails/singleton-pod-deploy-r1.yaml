apiVersion: v1
kind: Namespace
metadata:
  name: webhook-demo
---
apiVersion: v1
kind: Service
metadata:
  name: singleton-pod-blocker
  namespace: webhook-demo
spec:
  selector:
    app: singleton-pod-blocker
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singleton-pod-blocker
  namespace: webhook-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: singleton-pod-blocker
  template:
    metadata:
      labels:
        app: singleton-pod-blocker
    spec:
      containers:
        - name: webhook
          image: creativsrwr/singleton-pod-blocker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: webhook-certs
              mountPath: /tls
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: singleton-pod-blocker-tls
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-certgen-role
  namespace: webhook-demo
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-certgen-rolebinding
  namespace: webhook-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webhook-certgen-role
subjects:
  - kind: ServiceAccount
    name: default
    namespace: webhook-demo
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: singleton-pod-blocker
webhooks:
  - name: singleton-pod-blocker.webhook-demo.svc
    clientConfig:
      service:
        name: singleton-pod-blocker
        namespace: webhook-demo
        path: "/validate"
        port: 443
      caBundle: ""
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
        scope: "Namespaced"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - webhook-demo
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 2
---
apiVersion: batch/v1
kind: Job
metadata:
  name: webhook-certgen
  namespace: webhook-demo
spec:
  template:
    spec:
      containers:
        - name: certgen
          image: docker.io/jettech/kube-webhook-certgen:v1.5.2
          args:
            - patch
            - --webhook-name=singleton-pod-blocker
            - --namespace=webhook-demo
            - --secret-name=singleton-pod-blocker-tls
            - --patch-validating=true
            - --patch-mutating=false
      restartPolicy: OnFailure
  backoffLimit: 5
---
apiVersion: batch/v1
kind: Job
metadata:
  name: webhook-certgen-create
  namespace: webhook-demo
spec:
  template:
    spec:
      containers:
        - name: create
          image: docker.io/jettech/kube-webhook-certgen:v1.5.2
          args:
            - create
            - --host=singleton-pod-blocker.webhook-demo.svc
            - --secret-name=singleton-pod-blocker-tls
            - --namespace=webhook-demo
      restartPolicy: OnFailure
  backoffLimit: 3
