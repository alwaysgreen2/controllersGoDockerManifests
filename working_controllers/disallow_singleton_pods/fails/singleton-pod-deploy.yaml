apiVersion: v1
kind: Namespace
metadata:
  name: webhook-demo
---
apiVersion: v1
kind: Service
metadata:
  name: singleton-pod-blocker
  namespace: webhook-demo
spec:
  selector:
    app: singleton-pod-blocker
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singleton-pod-blocker
  namespace: webhook-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: singleton-pod-blocker
  template:
    metadata:
      labels:
        app: singleton-pod-blocker
    spec:
      containers:
        - name: webhook
          image: creativsrwr/singleton-pod-blocker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: webhook-certs
              mountPath: /tls
              readOnly: true
      volumes:
        - name: webhook-certs
          projected:
            sources:
              - secret:
                  name: singleton-pod-blocker-tls
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: webhook-demo
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: singleton-pod-blocker-tls
  namespace: webhook-demo
spec:
  commonName: singleton-pod-blocker.webhook-demo.svc
  dnsNames:
    - singleton-pod-blocker.webhook-demo.svc
    - singleton-pod-blocker.webhook-demo.svc.cluster.local
  secretName: singleton-pod-blocker-tls
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
  usages:
    - digital signature
    - key encipherment
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: singleton-pod-blocker
webhooks:
  - name: singleton-pod-blocker.webhook-demo.svc
    clientConfig:
      service:
        name: singleton-pod-blocker
        namespace: webhook-demo
        path: "/validate"
      caBundle: ""
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
        scope: "Namespaced"
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 2
---
apiVersion: batch/v1
kind: Job
metadata:
  name: webhook-certgen
  namespace: webhook-demo
spec:
  template:
    spec:
      containers:
        - name: certgen
          image: quay.io/jetstack/cert-manager-webhook-certgen:v2.0.0
          imagePullPolicy: IfNotPresent
          args:
            - patch
            - --webhook-name=singleton-pod-blocker
            - --namespace=webhook-demo
            - --secret-name=singleton-pod-blocker-tls
            - --patch-validating=true
      restartPolicy: OnFailure
  backoffLimit: 3
